
name: Build Material Catalog

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release-debug

  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Catalog APK
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release debug signing
        if: env.BUILD_TYPE == 'release-debug'
        shell: bash
        run: |
          cat > /tmp/catalog-debug-signing.init.gradle <<'EOF'
          gradle.projectsEvaluated {
              def catalog = gradle.rootProject.findProject(':catalog')

              catalog.android.buildTypes
                  .getByName('release')
                  .signingConfig = catalog.android.signingConfigs
                  .getByName('debug')
          }
          EOF

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :catalog:assembleDebug

      - name: Build release APK (debug signed)
        if: env.BUILD_TYPE == 'release-debug'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -I /tmp/catalog-debug-signing.init.gradle \
            :catalog:assembleRelease

      - name: Upload debug APK
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: material-catalog-debug
          path: catalog/build/outputs/apk/debug/catalog-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: env.BUILD_TYPE == 'release-debug'
        uses: actions/upload-artifact@v4
        with:
          name: material-catalog-release-debug-signed
          path: catalog/build/outputs/apk/release/catalog-release.apk
          if-no-files-found: error
          retention-days: 14
          
