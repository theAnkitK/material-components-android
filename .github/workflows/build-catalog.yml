
name: Build Material Catalog

on:
  push:
    branches-ignore:
      - 'renovate/**'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.idea/**'

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Material Catalog Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Configure debug signing for release
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/debug-signing.init.gradle" <<'EOF'
          gradle.projectsEvaluated {
              def catalog = gradle.rootProject.findProject(':catalog')

              catalog.android.buildTypes
                  .getByName('release')
                  .signingConfig = catalog.android.signingConfigs
                  .getByName('debug')
          }
          EOF

      - name: Build Catalog Release APK
        run: |
          ./gradlew --no-daemon \
            -I "$RUNNER_TEMP/debug-signing.init.gradle" \
            :catalog:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: material-catalog-release-debug-signed
          path: catalog/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
